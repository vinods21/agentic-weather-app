spring:
  application:
    name: agentic-weather-app
  datasource:
    # Defaults target the compose services published on localhost; the app container
    # overrides these via environment variables in compose.yaml.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:weather}
    username: ${POSTGRES_USER:weather}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      data-source-properties:
        # ADR 0008 §8: keep the server's "Detail:" text (offending values) out of exception messages.
        logServerErrorDetail: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Bounded Lettuce timeouts (ADR 0007 §10): a dead or silent Redis costs at most this long.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      add-mappings: false   # no static content; unknown paths -> NoHandlerFoundException (ADR 0003)

server:
  port: ${APP_PORT:8080}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"   # every log line carries the MDC request id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

weather:
  favourites:
    # Saved favourites (ADR 0008): maximum favourites per X-Client-Id, 1..100.
    max-per-client: ${WEATHER_FAVOURITES_MAX_PER_CLIENT:20}
    weather:
      # GET /api/v1/favourites/weather (ADR 0013): upstream calls in flight per request (1..20)
      # and the overall time budget of a request (1s..30s).
      max-concurrency: ${WEATHER_FAVOURITES_WEATHER_MAX_CONCURRENCY:4}
      timeout: ${WEATHER_FAVOURITES_WEATHER_TIMEOUT:5s}
  cache:
    key-prefix: ${WEATHER_CACHE_KEY_PREFIX:weather}
    # Weather cache (ADR 0007): only the Open-Meteo adapter is cached; fails open.
    enabled: ${WEATHER_CACHE_ENABLED:true}
    geocoding-ttl: ${WEATHER_CACHE_GEOCODING_TTL:7d}
    not-found-ttl: ${WEATHER_CACHE_NOT_FOUND_TTL:1h}
    current-ttl: ${WEATHER_CACHE_CURRENT_TTL:10m}
    forecast-ttl: ${WEATHER_CACHE_FORECAST_TTL:1h}
  api:
    cors:
      allowed-origins: ${WEATHER_API_CORS_ALLOWED_ORIGINS:}   # comma-separated; empty = deny all
  provider:
    type: ${WEATHER_PROVIDER:open-meteo}            # stub | open-meteo (ADR 0005)
    connect-timeout: ${WEATHER_PROVIDER_CONNECT_TIMEOUT:2s}
    read-timeout: ${WEATHER_PROVIDER_READ_TIMEOUT:3s}
    open-meteo:
      geocoding-base-url: ${WEATHER_PROVIDER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
      forecast-base-url: ${WEATHER_PROVIDER_FORECAST_BASE_URL:https://api.open-meteo.com}
