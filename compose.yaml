# Local runtime + integration-test environment. The ONLY test environment (no Testcontainers).
#
#   scripts/test-env.sh up          # postgres + redis, waits until healthy
#   scripts/test-env.sh it          # up + ./gradlew integrationTest
#   docker compose --profile app up -d --build --wait   # also run the app container
#
# Configuration comes from .env (copy .env.example). Ports bind to 127.0.0.1 only.
name: agentic-weather-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    profiles: ["app"]
    build:
      context: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_PORT: "8080"
      WEATHER_API_CORS_ALLOWED_ORIGINS: ${WEATHER_API_CORS_ALLOWED_ORIGINS:-}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open-meteo}
      WEATHER_PROVIDER_GEOCODING_BASE_URL: ${WEATHER_PROVIDER_GEOCODING_BASE_URL:-https://geocoding-api.open-meteo.com}
      WEATHER_PROVIDER_FORECAST_BASE_URL: ${WEATHER_PROVIDER_FORECAST_BASE_URL:-https://api.open-meteo.com}
      WEATHER_PROVIDER_CONNECT_TIMEOUT: ${WEATHER_PROVIDER_CONNECT_TIMEOUT:-2s}
      WEATHER_PROVIDER_READ_TIMEOUT: ${WEATHER_PROVIDER_READ_TIMEOUT:-3s}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
